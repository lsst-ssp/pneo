[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "digest42"
version = "0.0.1"
description = "Bayesian NEO tracklet classification by ranging over topocentric distance and range-rate"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Mario Juric", email = "mjuric@uw.edu" }]
dependencies = [
    "numpy>=1.24",
    "astropy>=5.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
