[workspace]
members = ["."]

[package]
name = "ds42-core"
# No version: the crate is an implementation detail of the Python package and
# is never published to crates.io; the package version lives in the git tag
# (setuptools-scm).  Cargo >= 1.75 defaults version to 0.0.0 for
# publish = false packages.
publish = false
edition = "2021"
description = "Fused Rust kernel for the ds42 Bayesian tracklet classifier"
license = "BSD-3-Clause"

[lib]
name = "ds42_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py311"] }
numpy = "0.28"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
